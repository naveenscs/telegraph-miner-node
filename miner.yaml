id: 901
name: "telegraph-groq-miner-node01"
protocol: "generic"
base_url: "https://your-live-domain.com" # Replace with your real public HTTPS URL (e.g., ngrok/cloudflared/VPS)

semantics:
  supported_intents:
    - "CHAT_COMPLETION"
  signal_mapping:
    label_field: "choices[0].message.content"
    confidence_field: "confidence"
    reason_field: "reason"

on_chain:
  transform: "none"
  min_price_usdc: 0.01

endpoints:
  - path: "/v1/chat/completions"
    method: "POST"
