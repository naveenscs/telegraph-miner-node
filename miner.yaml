version: "1"
kind: "miner"
id: 901
name: "telegraph-groq-miner-node01"
slug: "groq-llama31-instant-miner"
protocol: "generic"
base_url: "https://your-public-node-domain.com" # Replace with your real public HTTPS URL

auth:
  type: "none"

endpoints:
  - path: "/v1/chat/completions"
    external_path: "/v1/chat/completions"
    method: "POST"

semantics:
  supported_intents:
    - "CHAT_COMPLETION"
  signal_mapping:
    label_field: "output"
    confidence_field: "confidence"
    reason_field: "reason"

on_chain:
  min_price_usdc: 0.01
  transform: "direct"
