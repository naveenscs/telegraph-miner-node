version: "1"
kind: miner
id: "telegraph-groq-miner-node01"
slug: "groq-llama3-1-miner"
protocol: "1.0"
name: "Telegraph Groq LPU Miner"

auth:
  type: "none"

base_url: "https://your-public-node-domain.com"

endpoints:
  - name: "chat_completion"
    path: "/v1/chat/completions"
    external_path: "/v1/chat/completions"
    method: "POST"
    intent: "CHAT_COMPLETION"

semantics:
  signal_mapping:
    output_field: "choices[0].message.content"
    confidence_field: "usage.total_tokens"
    reasoning_field: "choices[0].finish_reason"

pricing:
  min_price_usdc: 0.001
