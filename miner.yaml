version: "1"
kind: miner
id: 901
slug: "groq-llama31-instant-miner"
name: "Telegraph Groq LPU Miner"
protocol: "generic"
auth:
  type: "none"

base_url: "https://your-public-node-domain.com" # Replace with live HTTPS URL

endpoints:
